<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>VTOverlay</title>
<link rel="stylesheet" href="shared/style.css">
<script type="importmap">
{ "imports": {
  "three": "/node_modules/three/build/three.module.js",
  "three/addons/": "/node_modules/three/examples/jsm/",
  "@pixiv/three-vrm": "/node_modules/@pixiv/three-vrm/lib/three-vrm.module.js"
} }
</script>
<script src="/node_modules/peerjs/dist/peerjs.min.js"></script>
<style>
  html, body { background: transparent !important; overflow: hidden; user-select: none; }
  #box { position: fixed; inset: 0; }
  #stage { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .pill { position: fixed; left: 50%; transform: translateX(-50%); background: #14121ae6; border: 1px solid var(--line);
          border-radius: 10px; padding: 8px 12px; font-size: 12px; text-align: center; white-space: nowrap; z-index: 5; }
  #status { top: 12px; }
  #status button { margin-left: 8px; padding: 2px 8px; font-size: 12px; }
  #bar { height: 3px; background: var(--line); border-radius: 2px; margin-top: 6px; overflow: hidden; }
  #bar i { display: block; height: 100%; width: 0; background: var(--accent); }

  /* control bar (mode switch + disconnect) */
  .controls { display: flex; flex-direction: column; gap: 6px; align-items: center; line-height: 1.5; }
  .controls b { color: var(--accent); }
  .controls .btns { display: flex; gap: 4px; flex-wrap: wrap; justify-content: center; }
  .controls button { padding: 4px 9px; font-size: 12px; }
  .controls button.cur { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .controls .sep { width: 1px; background: var(--line); margin: 0 4px; }
  #help { bottom: 12px; display: none; }

  /* ---- floating ---- */
  #frame { position: fixed; inset: 0; border: 2px dashed var(--accent); border-radius: 12px; pointer-events: none; display: none; background: #b48cff10; }
  body.floating.edit #frame, body.floating.edit #help { display: block; }
  body.floating.edit { cursor: grab; }
  body.floating.edit.dragging { cursor: grabbing; }

  /* ---- window ---- */
  body.window { background: radial-gradient(circle at 50% 35%, #2a2340 0%, var(--bg) 70%) !important; }
  body.window:hover #help { display: block; }

  /* ---- screen ---- */
  body.screen #box { inset: auto; }
  #anchor { position: fixed; pointer-events: none; display: none; }
  body.screen #anchor { display: block; }
  body.screen #status { position: absolute; top: -6px; transform: translate(-50%, -100%); pointer-events: auto; }
  #shareTag { position: fixed; right: 10px; top: 10px; transform: none; left: auto; padding: 5px 10px; display: none; }
  body.screen.sharing #shareTag { display: block; }
  #zoneEditor { position: fixed; inset: 0; display: none; background: transparent; cursor: crosshair; z-index: 10; }
  body.zoning #zoneEditor { display: block; }
  #zoneRect { position: absolute; border: 2px solid var(--accent); background: #b48cff1a; box-shadow: 0 0 0 9999px #0006; border-radius: 4px; }
  #zoneHelp { top: 50%; transform: translate(-50%, -50%); cursor: default; font-size: 13px; padding: 14px 18px; }
</style>
</head>
<body>
  <div id="box">
    <canvas id="stage"></canvas>
    <div class="pill" id="status"><span class="dot warn" id="dot"></span><span id="statusText">Connecting…</span><button id="retryBtn" hidden>Reconnect</button><div id="bar" hidden><i></i></div></div>
  </div>
  <div id="anchor"></div>
  <div id="frame"></div>
  <div class="pill controls" id="help"></div>
  <div class="pill" id="shareTag"><span class="dot bad"></span>Sharing this screen with the broadcaster</div>

  <div id="zoneEditor">
    <div id="zoneRect"></div>
    <div class="pill controls" id="zoneHelp">
      <div><b>Drag</b> to draw the area the avatar may use<br><span class="muted">Enter to confirm · Esc to cancel</span></div>
      <div class="btns"><button id="zoneAll">Whole screen</button><button id="zoneCancel">Cancel</button><button id="zoneDone" class="primary">Done</button></div>
      <div class="btns modeBtns"></div>
    </div>
  </div>
<script type="module" src="overlay.js"></script>
</body>
</html>
